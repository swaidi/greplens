name: Build Linux packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Add the packages to the release of this version (version from tauri.conf.json)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  linux:
    # the oldest supported Ubuntu, so the packages run on Linux Mint 21+, Ubuntu 22.04+ and similar
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for the desktop shell
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev file xdg-utils

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build interface
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test and freeze back end
        working-directory: backend
        run: |
          pip install -r requirements.txt pyinstaller pytest
          GREPLENS_FAKE_AI=1 python -m pytest -q tests
          python build_backend.py

      - name: Bundle llama.cpp engine (CPU build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # the newest release that has a Linux x64 CPU build
          url=$(gh api "repos/ggml-org/llama.cpp/releases?per_page=40" --jq \
            '[.[] | .assets[] | select(.name | test("bin-ubuntu-x64\\.(zip|tar\\.gz)$"))][0].browser_download_url')
          if [ -z "$url" ] || [ "$url" = "null" ]; then echo "No llama.cpp Linux build found"; exit 1; fi
          echo "Using $url"
          mkdir -p engine-tmp && cd engine-tmp
          curl -sSL "$url" -o engine.pkg
          case "$url" in *.zip) unzip -q engine.pkg ;; *) tar -xzf engine.pkg ;; esac
          cd ..
          dest=src-tauri/resources/engine
          server=$(find engine-tmp -type f -name llama-server | head -1)
          [ -n "$server" ] || { echo "llama-server not found"; exit 1; }
          cp "$server" "$dest/"
          find "$(dirname "$server")" -maxdepth 1 -name '*.so*' -exec cp -P {} "$dest/" \;
          chmod +x "$dest/llama-server"
          echo "llama.cpp $(basename "$url")" > "$dest/VERSION.txt"
          ls -la "$dest"
          LD_LIBRARY_PATH="$dest" "$dest/llama-server" --version

      - name: Bundle OCR language data (English and Arabic)
        run: |
          for lang in eng ara; do
            curl -sSL "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$lang.traineddata" -o "src-tauri/resources/tessdata/$lang.traineddata"
          done

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build packages (.deb and AppImage)
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build --bundles deb,appimage

      - name: Start the packaged back end
        run: |
          set -e
          deb=$(ls src-tauri/target/release/bundle/deb/*.deb | head -1)
          sudo apt-get install -y "./$deb"
          backend=$(dpkg -L "$(dpkg-deb -f "$deb" Package)" | grep -m1 'greplens-backend$')
          echo "Back end: $backend"
          GREPLENS_DATA=$RUNNER_TEMP/gl GREPLENS_PORT=8799 "$backend" &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8799/api/health && break; sleep 1; done
          echo; curl -sf http://127.0.0.1:8799/api/hardware | head -c 400; echo
          curl -sf http://127.0.0.1:8799/api/models | python3 -c "import json,sys; d=json.load(sys.stdin); print('engine', d['engine'])"
          curl -sf http://127.0.0.1:8799/ | head -c 200; echo

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: GrepLens-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Add to the release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "GrepLens $tag" --generate-notes
          gh release upload "$tag" src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/appimage/*.AppImage --clobber
