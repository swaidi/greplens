name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this build as a release (version from tauri.conf.json)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build interface
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test and freeze back end
        working-directory: backend
        run: |
          pip install -r requirements.txt pyinstaller pytest
          python -m pytest -q tests
          python build_backend.py

      - name: Check handwriting recognizer
        working-directory: backend
        continue-on-error: true
        run: python tests/hw_check.py

      - name: Bundle llama.cpp engine (CPU build)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # "latest" may point to a release without engine builds, so take the newest release that has one
          $releases = gh api "repos/ggml-org/llama.cpp/releases?per_page=40" | ConvertFrom-Json
          $rel = $null; $asset = $null
          foreach ($r in $releases) {
            $a = $r.assets | Where-Object { $_.name -match "win.*cpu.*x64.*\.zip$" } | Select-Object -First 1
            if ($a) { $rel = $r; $asset = $a; break }
          }
          if (-not $asset) {
            $releases | Select-Object -First 3 | ForEach-Object { "$($_.tag_name): $(($_.assets.name) -join ', ')" }
            throw "No llama.cpp Windows CPU build found in the last 40 releases"
          }
          "Using $($asset.name) from $($rel.tag_name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile engine.zip
          Expand-Archive engine.zip -DestinationPath engine-tmp
          $dest = "src-tauri/resources/engine"
          Get-ChildItem engine-tmp -Recurse -File | Where-Object { $_.Extension -in ".exe", ".dll" } |
            Where-Object { $_.Name -eq "llama-server.exe" -or $_.Extension -eq ".dll" } | Copy-Item -Destination $dest
          if (-not (Test-Path "$dest/llama-server.exe")) { throw "llama-server.exe was not found in $($asset.name)" }
          "llama.cpp $($rel.tag_name)" | Out-File "$dest/VERSION.txt"

      - name: Bundle OCR language data (English and Arabic)
        shell: pwsh
        run: |
          foreach ($lang in "eng", "ara") {
            Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$lang.traineddata" -OutFile "src-tauri/resources/tessdata/$lang.traineddata"
          }

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build installer
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: GrepLens-windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "tag=v$v" >> $env:GITHUB_OUTPUT

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: GrepLens ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          draft: false
          make_latest: true
          generate_release_notes: true
          body: |
            Windows installer: download `GrepLens_*_x64-setup.exe` below and run it.
            Installed copies of GrepLens offer this update automatically (Settings > Updates > Check now).
          files: src-tauri/target/release/bundle/nsis/*-setup.exe
