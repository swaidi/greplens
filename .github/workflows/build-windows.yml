name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build interface
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test and freeze back end
        working-directory: backend
        run: |
          pip install -r requirements.txt pyinstaller pytest
          python -m pytest -q tests
          python build_backend.py

      - name: Bundle llama.cpp engine (CPU build)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = gh api repos/ggml-org/llama.cpp/releases/latest | ConvertFrom-Json
          $asset = $rel.assets | Where-Object { $_.name -match "bin-win-cpu-x64\.zip$" } | Select-Object -First 1
          if (-not $asset) { throw "llama.cpp Windows CPU build not found in release $($rel.tag_name)" }
          Invoke-WebRequest $asset.browser_download_url -OutFile engine.zip
          Expand-Archive engine.zip -DestinationPath engine-tmp
          $dest = "src-tauri/resources/engine"
          Get-ChildItem engine-tmp -Recurse -File | Where-Object { $_.Extension -in ".exe", ".dll" } |
            Where-Object { $_.Name -eq "llama-server.exe" -or $_.Extension -eq ".dll" } | Copy-Item -Destination $dest
          "llama.cpp $($rel.tag_name)" | Out-File "$dest/VERSION.txt"

      - name: Bundle OCR language data (English and Arabic)
        shell: pwsh
        run: |
          foreach ($lang in "eng", "ara") {
            Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$lang.traineddata" -OutFile "src-tauri/resources/tessdata/$lang.traineddata"
          }

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build installer
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: GrepLens-windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: src-tauri/target/release/bundle/nsis/*-setup.exe
