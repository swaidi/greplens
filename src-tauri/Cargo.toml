[package]
name = "greplens"
version = "0.1.1"
description = "GrepLens: offline document review with local AI"
authors = ["A.T.Grep"]
license = "AGPL-3.0-only"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
